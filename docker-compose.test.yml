version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: test_postgres
    ports:
      - "${POSTGRES_PORT}:5432"
    env_file:
      - .test.env
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

  redis:
    image: redis:8.0-alpine
    container_name: test_redis
    ports:
      - "${REDIS_PORT}:6379"
    env_file:
      - .test.env
    command: redis-server --save "" --appendonly no
    volumes:
      - redis_test_data:/data

volumes:
  postgres_test_data:
  redis_test_data:
