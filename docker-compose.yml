version: "3.9"

services:
  db:
    image: postgres:17
    container_name: async_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:8.0-alpine
    container_name: async_redis
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    command: redis-server --save "" --appendonly no

  app:
    build:
      context: .
      dockerfile: src/Dockerfile
    container_name: async_fastapi
    restart: always
    depends_on:
      - db
      - redis
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  pg_data: